# ============================================================
#  تنظیمات ربات تولید محتوای اینستاگرام
#  همه‌ی چیزهایی که باید ویرایش کنید در همین فایل است.
#  کلیدها و توکن‌ها در Secrets گیت‌هاب می‌روند، نه اینجا.
# ============================================================

# ============================================================
#  حالت کار
#    buffer = خودکار کامل. ربات محتوا را می‌سازد و در صف بافر می‌گذارد؛
#             بافر سر ساعت روی اینستاگرام منتشر می‌کند. ← حالت فعلی شما
#    batch  = محتوا در تلگرام تحویل داده می‌شود و خودتان زمان‌بندی می‌کنید
#    api    = انتشار مستقیم از طریق API متا (نیاز به حساب توسعه‌دهنده)
# ============================================================
mode: "buffer"

# ============================================================
#  بافر
# ============================================================
buffer:
  # نام کانال در بافر. خالی = اولین کانال اینستاگرام خودکار پیدا می‌شود.
  channel_name: ""
  organization_id: ""

  # سقف پست‌هایی که بافر اجازه می‌دهد هم‌زمان در صف باشند.
  # پلن رایگان بافر ۱۰ تاست. اگر پلن پولی گرفتید این عدد را بالا ببرید.
  # ربات قبل از شروع صف را می‌شمارد و فقط به اندازه‌ی جای خالی پست می‌سازد.
  max_queue: 10

# ============================================================
#  برند
# ============================================================
brand:
  name: "گروه اکانت‌های امیرکبیر"
  niche: "ارائه‌ی اشتراک ابزارهای نگارش علمی و هوش مصنوعی برای پژوهشگران ایرانی"
  audience: "دانشجویان تحصیلات تکمیلی، اساتید و پژوهشگران فارسی‌زبان، داخل و خارج از ایران"
  tone: "حرفه‌ای و قابل اعتماد، ساده و بدون اغراق؛ لحن یک مشاور، نه یک دستفروش"
  language: "fa"
  cta: "برای سفارش، دایرکت بدید 📩"
  website: "autgrammarly.com"

  # ------------------------------------------------------------
  #  قواعد سختگیرانه‌ی محتوا
  #  این‌ها مستقیم به مدل داده می‌شوند. در این حوزه، یک ادعای اشتباه
  #  می‌تواند هم اعتبار شما را ببرد و هم مشکل حقوقی بسازد.
  # ------------------------------------------------------------
  banned_topics:
    - "سیاست و مسائل مذهبی"
    - "ادعای نمایندگی رسمی، مجوز، یا همکاری با شرکت سازنده — مگر اینکه فیلد authorized صریحاً نام آن شرکت و تاریخ قرارداد را آورده باشد. عبارت «ارائه توسط ...» فقط یعنی فروشنده کیست و به‌هیچ‌وجه به معنی نمایندگی نیست"
    - "هر عبارتی که القا کند اکانت مستقیماً از خود شرکت سازنده خریداری شده است"
    - "استفاده از لوگو یا نام تجاری شرکت‌ها به شکلی که تأیید یا وابستگی را القا کند"
    - "هر پیشنهادی برای دور زدن سامانه‌های سنجش سرقت ادبی یا پنهان کردن تقلب علمی"
    - "وعده‌ی مدت اعتبار یا گارانتی‌ای که در کاتالوگ نیامده"
    - "مقایسه‌ی قیمت با نرخ رسمی شرکت‌ها به‌صورت درصد تخفیف"
    - "ادعای پشتیبانی رسمی، آپدیت یا خدمات پس از فروشِ خودِ آن شرکت‌ها"

  colors:
    background: "#0F1724"
    accent: "#22D3EE"
    text: "#FFFFFF"
    muted: "#94A3B8"

# ============================================================
#  تقویم محتوایی — چرخش خودکار انواع پست
#  برای کسب‌وکار خدمات دیجیتال بازنویسی شده: به‌جای «بسته‌بندی و ارسال»،
#  موضوعاتی که برای این حوزه واقعاً معنی دارند.
# ============================================================
content_plan:
  - key: "product_spotlight"
    type: "single"
    label: "معرفی سرویس"
    brief: >
      یک سرویس از کاتالوگ را معرفی کن. فقط از توضیح «what_customer_gets» همان
      قلم استفاده کن و دقیقاً بگو مشتری چه چیزی تحویل می‌گیرد. اغراق نکن.

  - key: "tip"
    type: "carousel"
    slides: 5
    label: "نکته‌ی پژوهشی"
    brief: >
      یک نکته‌ی کاربردی درباره‌ی نگارش علمی، ساختار مقاله، رفرنس‌دهی یا
      کار با ابزارهای هوش مصنوعی. کاملاً آموزشی — هیچ فروشی در کار نباشد.

  - key: "myth_buster"
    type: "single"
    label: "باور غلط رایج"
    brief: >
      یک باور اشتباه رایج بین دانشجویان درباره‌ی نگارش علمی یا ابزارهای
      هوش مصنوعی را مطرح کن و واقعیت را توضیح بده.

  - key: "comparison"
    type: "carousel"
    slides: 4
    label: "مقایسه‌ی ابزارها"
    brief: >
      دو ابزار از کاتالوگ را مقایسه کن و بگو هرکدام مناسب چه کاری است.
      منصف باش — نقاط ضعف هرکدام را هم بگو.

  - key: "trust"
    type: "single"
    label: "شفافیت و اعتمادسازی"
    brief: >
      درباره‌ی نحوه‌ی کار خودتان بنویس: مشتری دقیقاً چه تحویل می‌گیرد،
      پشتیبانی چطور است، اگر مشکلی پیش بیاید چه می‌شود. شفافیت، نه تبلیغ.

  - key: "faq"
    type: "carousel"
    slides: 4
    label: "سوالات پرتکرار"
    brief: >
      به یک سوال پرتکرار مشتری‌ها پاسخ روشن و صادقانه بده. اگر جواب
      محدودیتی دارد، همان را هم بگو.

  - key: "ethics"
    type: "single"
    label: "استفاده‌ی درست"
    brief: >
      درباره‌ی استفاده‌ی مسئولانه از ابزارهای هوش مصنوعی در کار پژوهشی
      بنویس — مرز بین کمک‌گرفتن و تقلب علمی کجاست.

# ============================================================
#  زمان‌بندی
# ============================================================
schedule:
  timezone: "Asia/Tehran"
  post_at: "21:00"

# ============================================================
#  تولید تصویر
# ============================================================
image:
  mode: "template"
  size: 1080
  logo_path: ""
  products_dir: "assets/products"

# ============================================================
#  میزبانی عمومی تصاویر
#    github = تصاویر در شاخه‌ی media همین مخزن. مخزن باید public باشد.
#    s3     = هر سرویس سازگار با S3
# ============================================================
storage:
  provider: "github"
  github:
    repo: ""          # روی GitHub Actions خودکار پر می‌شود
    branch: "media"
  bucket: "insta-media"
  public_base_url: ""
  endpoint_url: ""
  region: "auto"

# ============================================================
#  مدل زبانی
# ============================================================
llm:
  provider: "openai"
  model: "gpt-5.6-terra"
  base_url: "https://api.openai.com/v1"
  max_tokens: 4000
  temperature: 1.0
  history_window: 30

# ============================================================
#  اینستاگرام — فقط برای حالت api
# ============================================================
instagram:
  api_flavor: "instagram_login"
  api_version: "v23.0"
  daily_post_cap: 2

# ============================================================
#  ایمنی
# ============================================================
safety:
  # تا وقتی کاتالوگ کامل نشده، این را روی true نگه دارید.
  dry_run: false
  max_hashtags: 12
  max_caption_chars: 1500

