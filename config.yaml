# ============================================================
#  تنظیمات ربات تولید محتوای اینستاگرام
#  همه‌ی چیزهایی که باید ویرایش کنید در همین فایل است.
#  کلیدها و توکن‌ها در فایل .env نگهداری می‌شوند (نه اینجا).
# ============================================================

# ============================================================
#  حالت کار
#
#    buffer = خودکار کامل. ربات محتوا را می‌سازد و مستقیم در صف بافر
#             می‌گذارد؛ بافر سر ساعت روی اینستاگرام منتشر می‌کند.
#             هیچ کار دستی‌ای نمی‌ماند. ← حالت فعلی شما
#
#    batch  = محتوا ساخته و در تلگرام تحویل داده می‌شود؛ زمان‌بندی را
#             خودتان در اپ اینستاگرام انجام می‌دهید. (پشتیبان)
#
#    api    = انتشار مستقیم از طریق API رسمی متا (نیاز به حساب توسعه‌دهنده)
# ============================================================
mode: "buffer"

# ============================================================
#  بافر
# ============================================================
buffer:
  # نام کانال در بافر. خالی بگذارید تا خودش اولین کانال اینستاگرام را پیدا کند.
  # فقط اگر چند اکانت اینستاگرام به بافر وصل کرده‌اید پرش کنید.
  channel_name: ""
  # خالی بگذارید مگر اینکه چند سازمان در بافر داشته باشید.
  organization_id: ""

brand:
  # نام برند / فروشگاه شما
  name: "گروه اکانتهای امیرکبیر"
  # موضوع و حوزه فعالیت پیج — هرچه دقیق‌تر، محتوا بهتر
  niche: "فروشگاه آنلاین ارائه اکانت های پژوهشی و هوش مصنوعی AI"
  # مخاطب هدف
  audience: "همه دانشجویان و اساتید ایرانی و خارجی داخل ایران و خارج از ایران گروه سنی مختلف در رشته های مختلف"
  # لحن نوشتار
  tone: "صمیمی، پرانرژی، بدون اغراق و بدون وعده‌ی دروغ"
  # زبان محتوا
  language: "fa"
  # اطلاعات تماس/سایت که در انتهای کپشن می‌آید (خالی بگذارید تا حذف شود)
  cta: "برای سفارش، دایرکت بدید 📩"
  website: ""

  # موضوعاتی که هرگز نباید درباره‌شان پست ساخته شود
  banned_topics:
    - "سیاست"
    - "مسائل مذهبی"
    - "ادعای درمان پزشکی"

  # رنگ‌های برند (برای قالب تصویر)
  colors:
    background: "#0F1724"
    accent: "#22D3EE"
    text: "#FFFFFF"
    muted: "#94A3B8"

# ============================================================
#  تقویم محتوایی — چرخش خودکار انواع پست
#  هر روز یکی از این‌ها به‌ترتیب انتخاب می‌شود.
#  type: single | carousel   (reel نیاز به فایل ویدیو دارد؛ پایین‌تر توضیح داده شده)
# ============================================================
content_plan:
  - key: "product_spotlight"
    type: "single"
    label: "معرفی محصول"
    brief: "یک محصول از کاتالوگ را معرفی کن؛ یک مزیت کلیدی و یک کاربرد روزمره را برجسته کن."

  - key: "tip"
    type: "carousel"
    slides: 5
    label: "نکته آموزشی"
    brief: "یک نکته کاربردی مرتبط با حوزه پیج که مخاطب بتواند همین امروز استفاده کند. فروشندگی مستقیم نکن."

  - key: "myth_buster"
    type: "single"
    label: "باور غلط رایج"
    brief: "یک باور اشتباه رایج در این حوزه را مطرح کن و واقعیت را توضیح بده."

  - key: "comparison"
    type: "carousel"
    slides: 4
    label: "مقایسه"
    brief: "دو گزینه یا دو روش را مقایسه کن و بگو هرکدام مناسب چه کسی است."

  - key: "behind_scenes"
    type: "single"
    label: "پشت صحنه / اعتمادسازی"
    brief: "درباره کیفیت، گارانتی، بسته‌بندی یا فرایند ارسال بنویس. اعتمادسازی، نه تبلیغ."

  - key: "faq"
    type: "carousel"
    slides: 4
    label: "سوالات پرتکرار"
    brief: "به یک سوال پرتکرار مشتری‌ها پاسخ روشن بده."

  - key: "offer"
    type: "single"
    label: "پیشنهاد ویژه"
    brief: "یک پیشنهاد یا مزیت خرید را مطرح کن. فقط از تخفیف‌های واقعی موجود در کاتالوگ استفاده کن."

# ============================================================
#  زمان‌بندی
# ============================================================
schedule:
  timezone: "Asia/Tehran"
  # ساعت انتشار روزانه (۲۴ ساعته) — بهترین بازه برای ایران معمولاً ۲۰ تا ۲۳
  post_at: "21:00"

# ============================================================
#  تولید تصویر
#  mode:
#    template  = رندر گرافیکی با Pillow روی عکس محصول یا پس‌زمینه‌ی گرادیانی (رایگان، پایدار)
#    ai        = تولید تصویر با API مدل تصویرساز (نیاز به کلید و هزینه دارد)
# ============================================================
image:
  mode: "template"
  size: 1080          # پست مربعی 1080x1080
  logo_path: ""       # مسیر فایل لوگو png (اختیاری)
  products_dir: "assets/products"   # پوشه عکس محصولات (jpg/png)

# ============================================================
#  محل میزبانی عمومی تصاویر
#  اینستاگرام تصویر را از یک URL عمومی برمی‌دارد، پس باید جایی آپلود شود.
#
#  provider: github | s3 | local
#    github = ساده‌ترین راه. تصاویر در شاخه‌ی media همین مخزن ذخیره می‌شوند.
#             هیچ سرویس دیگری لازم نیست. ← مخزن باید public باشد.
#    s3     = هر سرویس سازگار با S3 (Cloudflare R2 / آروان‌کلود / لیارا / MinIO)
#    local  = فقط برای تست؛ چیزی آپلود نمی‌شود
# ============================================================
storage:
  provider: "github"

  github:
    # نام مخزن به شکل «نام‌کاربری/نام‌مخزن».
    # اگر روی GitHub Actions اجرا شود و اینجا را خالی بگذارید، خودکار پر می‌شود.
    repo: ""
    branch: "media"

  # --- فقط اگر provider را روی s3 گذاشتید این‌ها را پر کنید ---
  bucket: "insta-media"
  public_base_url: ""
  endpoint_url: ""
  region: "auto"

# ============================================================
#  مدل زبانی تولید محتوا
# ============================================================
llm:
  model: "claude-sonnet-4-6"
  max_tokens: 4000
  # چند پست اخیر به مدل نشان داده شود تا تکراری ننویسد
  history_window: 30

# ============================================================
#  اینستاگرام
#  api_flavor:
#    instagram_login = Instagram API with Instagram Login (بدون نیاز به پیج فیسبوک) — پیشنهادی
#    facebook_login  = Instagram API with Facebook Login (نیاز به پیج فیسبوک متصل)
# ============================================================
instagram:
  api_flavor: "instagram_login"
  api_version: "v23.0"
  # سقف ایمن انتشار در ۲۴ ساعت (سقف رسمی متا بالاتر است ولی محافظه‌کارانه عمل می‌کنیم)
  daily_post_cap: 2

# ============================================================
#  ایمنی
# ============================================================
safety:
  # اگر true باشد هیچ‌چیز منتشر نمی‌شود؛ فقط ساخته و ذخیره می‌شود (برای تست)
  dry_run: true
  # حداکثر تعداد هشتگ
  max_hashtags: 12
  # حداکثر طول کپشن (سقف اینستاگرام ۲۲۰۰ کاراکتر است)
  max_caption_chars: 1500
